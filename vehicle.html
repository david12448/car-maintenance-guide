<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>차량 상세페이지 이동</title>
</head>
<body>
  <p id="message">차량 상세페이지로 이동 중입니다.</p>
  <script>
    (function(){
      var id=new URLSearchParams(location.search).get("id");
      if(!id){ location.replace("./"); return; }
      fetch("./data/vehicles.json")
        .then(function(r){ if(!r.ok) throw new Error("load"); return r.json(); })
        .then(function(rows){
          var v=rows.find(function(x){ return x.id===id; });
          if(v && v.urlStatus==="pilot"){
            location.replace("./maintenance/"+encodeURIComponent(v.makerSlug)+"/"+encodeURIComponent(v.publicSlug)+"/");
            return;
          }
          location.replace("./vehicles/"+encodeURIComponent(id)+"/");
        })
        .catch(function(){ location.replace("./vehicles/"+encodeURIComponent(id)+"/"); });
    })();
  </script>
</body>
</html>
