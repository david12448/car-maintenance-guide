<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>차량 상세페이지 이동</title>
  <script>
    (function(){
      var id=new URLSearchParams(location.search).get("id");
      if(id){location.replace("./vehicles/"+encodeURIComponent(id)+"/");}
      else{location.replace("./");}
    })();
  </script>
</head>
<body>
  <p>차량 상세페이지로 이동 중입니다.</p>
</body>
</html>
