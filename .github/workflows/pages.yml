name: Deploy car maintenance guide to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public data
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public JSON
        run: python validators/validate_public.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check app-v2.js
          node --check vehicle.js
          node --check fuel/fuel.js
          node --check purchase/purchase.js
      - name: Build static vehicle pages
        run: python scripts/build_vehicle_pages.py
      - name: Unit test canonical and sitemap generator
        run: python -m unittest discover -s tests -p 'test_site_metadata.py'
      - name: Build SEO metadata for current deployment base
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python scripts/build_site_metadata.py
      - name: Verify SEO artifacts
        run: |
          test -f sitemap.xml
          grep -q 'rel="canonical"' vehicles/hyundai-sonata-nf/index.html
      - name: Verify service category pages
        run: |
          test -f fuel/index.html
          test -f purchase/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
