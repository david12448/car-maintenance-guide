name: Deploy car maintenance guide to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public data
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public JSON
        run: python validators/validate_public.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check app-v2.js
          node --check vehicle.js
          node --check fuel/fuel.js
          node --check purchase/purchase.js
      - name: Build static vehicle pages
        env:
          PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
        run: python scripts/build_vehicle_pages.py
      - name: Validate pretty URLs and SEO
        run: python validators/validate_routes.py
      - name: Verify service category pages
        run: |
          test -f fuel/index.html
          test -f purchase/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
