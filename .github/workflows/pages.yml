name: Deploy car maintenance guide to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public data
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public JSON
        run: python validators/validate_public.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check app-v2.js
          node --check vehicle.js
          node --check fuel/fuel.js
          node --check purchase/purchase.js
      - name: Build static vehicle pages
        run: python scripts/build_vehicle_pages.py
      - name: Verify service category pages
        run: |
          test -f fuel/index.html
          test -f purchase/index.html
      - name: Validate portable URL routes
        run: python scripts/check_url_routes.py
      - name: Local HTTP direct-link smoke
        run: |
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/auto-pretty-urls.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8766/vehicles/hyundai-avante-md/ | grep -q '아반떼'
          curl -fsS http://127.0.0.1:8766/vehicles/mercedes-eclass-w212/ | grep -q 'E-Class'
          curl -fsS 'http://127.0.0.1:8766/vehicle.html?id=hyundai-avante-md' >/dev/null
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
